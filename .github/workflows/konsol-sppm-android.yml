name: Build KonSol-SPPM Android APK
on:
  push:
    branches: [main]
    paths:
      - 'KonSol-SPPM/**'
      - '.github/workflows/konsol-sppm-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check preinstalled Android SDK
        run: |
          test -d "$ANDROID_HOME"
          command -v sdkmanager
          sdkmanager --version
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android platform
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build debug APK
        working-directory: KonSol-SPPM
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: KonSol-SPPM-v0.1-debug-apk
          path: KonSol-SPPM/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
