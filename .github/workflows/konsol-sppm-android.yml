name: Build KonSol-SPPM Android APK
on:
  push:
    branches: [main]
    paths:
      - 'KonSol-SPPM/**'
      - '.github/workflows/konsol-sppm-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK without legacy tools package
        uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android platform
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test TEXT/HEX and programmable button codec
        run: |
          mkdir -p /tmp/konsol-codec
          javac -encoding UTF-8 -d /tmp/konsol-codec \
            KonSol-SPPM/app/src/main/java/io/github/aidevelopersmonster/konsolsppm/HexCodec.java \
            KonSol-SPPM/app/src/main/java/io/github/aidevelopersmonster/konsolsppm/MacroCommand.java \
            KonSol-SPPM/tools/TestCodec.java
          java -cp /tmp/konsol-codec io.github.aidevelopersmonster.konsolsppm.TestCodec
      - name: Build debug APK
        working-directory: KonSol-SPPM
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify Android 7 APK and actual DEX content
        shell: bash
        run: |
          set -euo pipefail
          apk='KonSol-SPPM/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$apk"
          unzip -Z -1 "$apk" | grep -Fx 'classes.dex'
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -x "$aapt"
          "$aapt" dump badging "$apk" | grep -E "^(package:|sdkVersion:|targetSdkVersion:)"
          min_sdk=$("$aapt" dump badging "$apk" | sed -n "s/^sdkVersion:'\\([0-9]*\\)'.*/\\1/p")
          test "$min_sdk" = '24'
          echo "PASS: APK contains executable DEX and supports Android 7.0 (API 24)"
          sha256sum "$apk"
          ls -lh "$apk"
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: KonSol-SPPM-v0.1.1-Android7-debug-apk
          path: KonSol-SPPM/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
