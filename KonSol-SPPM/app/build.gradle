plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.aidevelopersmonster.konsolsppm'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.aidevelopersmonster.konsolsppm'
        // Same minimum and target API policy as tested App17 on Redmi 5 Plus.
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName '0.1.3'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
