name: KonSol AT Studio tests

on:
  pull_request:
    paths:
      - 'KonSol-AT-Studio/**'
      - '.github/workflows/konat-tests.yml'
  push:
    branches: [main]
    paths:
      - 'KonSol-AT-Studio/**'
      - '.github/workflows/konat-tests.yml'

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.9', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
        working-directory: KonSol-AT-Studio
      - name: Validate profiles
        run: python main.py --check-profiles
        working-directory: KonSol-AT-Studio
      - name: Unit tests
        run: python -m unittest discover -s tests -v
        working-directory: KonSol-AT-Studio
